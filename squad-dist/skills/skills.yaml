# ============================================================================
# Category Definitions
# ============================================================================

categories:
  frontend-design:
    description: Skills for creating web interfaces, visual designs, and UI components
    agents:
      - engineer:frontend
      - engineer:fullstack

  document-processing:
    description: Skills for reading, writing, and manipulating documents (PDF, Word, Excel, PowerPoint)
    agents:
      - researcher:documentation
      - engineer:fullstack
      - engineer:backend

  development-tools:
    description: Skills for building tools, MCP servers, and extending Squad capabilities
    agents:
      - engineer:backend
      - engineer:fullstack
      - researcher:codebase

  testing:
    description: Skills for automated testing and verification
    agents:
      - tester:e2e
      - tester:integration
      - tester:unit
      - engineer:fullstack

  communications:
    description: Skills for drafting communications and documentation
    agents:
      - researcher:documentation
      - engineer:fullstack

  translation:
    description: Language translation and localization skills
    agents:
      - researcher:documentation
      - engineer:fullstack

# ============================================================================
# Skill Discovery Rules
# ============================================================================

discovery:
  # How agents should discover and use skills

  automatic:
    # Skills that can be auto-invoked based on task keywords
    enabled: true
    confidence_threshold: 0.8

  manual:
    # Skills that require explicit invocation
    require_explicit: []

  suggestions:
    # When to suggest skills to users
    on_task_match: true
    on_agent_selection: true
