# Squad Skills Registry
# Version: 1.0.0
# Purpose: Centralized registry of all available skills with metadata and routing info

skills:
  # ============================================================================
  # Frontend Design & UI Skills
  # ============================================================================

  frontend-design:
    name: frontend-design
    category: frontend-design
    description: Create distinctive, production-grade frontend interfaces with high design quality. Use for building web components, pages, dashboards, React components, or any web UI that needs exceptional aesthetics.
    usefulness: 9
    agents:
      - engineer:frontend
      - engineer:fullstack
    triggers:
      - "design interface"
      - "create component"
      - "build UI"
      - "frontend design"
      - "web page"
      - "dashboard"
    readonly: false
    destructive: false

  web-artifacts-builder:
    name: web-artifacts-builder
    category: frontend-design
    description: Build complete web applications and interactive artifacts. Ideal for prototypes, demos, and self-contained web apps.
    usefulness: 8
    agents:
      - engineer:frontend
      - engineer:fullstack
    triggers:
      - "web app"
      - "interactive prototype"
      - "demo"
      - "artifact"
    readonly: false
    destructive: false

  canvas-design:
