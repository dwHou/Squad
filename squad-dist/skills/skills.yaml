    triggers:
      - "algorithmic art"
      - "generative art"
      - "visualization"
      - "creative coding"
    readonly: false
    destructive: false

  slack-gif-creator:
    name: slack-gif-creator
    category: frontend-design
    description: Create animated GIFs optimized for Slack and other messaging platforms.
    usefulness: 5
    agents:
      - engineer:frontend
    triggers:
      - "gif"
